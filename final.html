<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>ExamTopics PlayGround</title>
  
  <style>
    /* ==========================================
       CSS CUSTOM PROPERTIES (THEMING)
       ========================================== */
    :root {
      /* Light theme colors */
      --bg: #f6f7fb; 
      --surface: #ffffff; 
      --text: #1f2937; 
      --muted: #5f6b7a; 
      --border: #e5e7eb;
      --primary: #2563eb; 
      --primary-ink: #ffffff;
      --correct: #16a34a; 
      --wrong: #dc2626;
      --chip: #eef2ff; 
      --chip-text: #1e3a8a;
      --indent: 18px;
      --vote-bg: #eaf0ff; 
      --vote-fill: #2563eb; 
      --vote-ink: #0b1d4d;
      --topicbar-bg: #119da4; 
      --topicbar-ink: #ffffff;
    }
    
    /* Dark theme overrides */
    [data-theme="dark"] {
      --bg: #0f1115; 
      --surface: #171923; 
      --text: #e5e7eb; 
      --muted: #9aa0ae; 
      --border: #262a36;
      --primary: #6ea0ff; 
      --primary-ink: #081020;
      --chip: #1e293b; 
      --chip-text: #bfdbfe;
      --correct: #22c55e; 
      --wrong: #ef4444;
      --vote-bg: #101c3a; 
      --vote-fill: #6ea0ff; 
      --vote-ink: #cbd5e1;
      --topicbar-bg: #178b91; 
      --topicbar-ink: #eaf7f7;
    }

    /* ==========================================
       BASE STYLES
       ========================================== */
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Noto Sans";
    }

    /* ==========================================
       HEADER & NAVIGATION
       ========================================== */
    header { 
      padding: 10px 10px; 
      position: sticky; 
      top: 10px; 
      z-index: 10; 
      border-bottom: 1px solid var(--border);
      backdrop-filter: saturate(180%) blur(6px);
      background: color-mix(in oklab, var(--bg) 10%, transparent); 
    }

    .bar { 
      max-width: 1100px; 
      margin: 0 auto; 
      padding: 8px 12px; 
      display: flex; 
      align-items: center; 
      gap: 10px; 
    }

    .brand { 
      font-weight: 800; 
    }

    .spacer { 
      flex: 1; 
    }

    .hamb { 
      border: 1px solid var(--border); 
      background: var(--surface); 
      color: var(--text);
      border-radius: 10px; 
      padding: 8px 10px; 
      display: none; 
    }

    .menu { 
      display: flex; 
      gap: 8px; 
      flex-wrap: wrap; 
      align-items: center; 
    }

    .row { 
      display: flex; 
      gap: 8px; 
      align-items: center; 
      flex-wrap: nowrap; 
    }

    /* ==========================================
       FORM CONTROLS
       ========================================== */
    input[type="text"], 
    input[type="number"], 
    select {
      padding: 8px 10px; 
      background: var(--surface); 
      color: var(--text);
      border: 1px solid var(--border); 
      border-radius: 10px; 
      min-width: 20px;
    }
    
    /* Specific width controls for form elements */
    #exam { 
      width: 90px;
    }
    
    #jump { 
      width: 30px;
    }
    
    #pagesize { 
      width: 70px;
    }
    
    .btn { 
      padding: 8px 12px; 
      border-radius: 10px; 
      border: 1px solid var(--border);
      background: var(--surface); 
      color: var(--text); 
      cursor: pointer; 
      transition: all 0.2s ease; 
    }
    
    .btn:hover { 
      background: color-mix(in oklab, var(--surface), var(--primary) 12%);
      border-color: color-mix(in oklab, var(--border), var(--primary) 30%); 
    }
    
    .btn.primary { 
      background: var(--primary); 
      color: var(--primary-ink);
      border-color: color-mix(in oklab, var(--primary), black 10%); 
    }
    
    .btn.primary:hover { 
      background: color-mix(in oklab, var(--primary), white 15%);
      border-color: color-mix(in oklab, var(--primary), white 5%); 
    }
    
    .btn:disabled {
      opacity: .6; 
      cursor: not-allowed;
    }
    
    .btn:disabled:hover { 
      background: var(--surface); 
      border-color: var(--border); 
    }

    /* ==========================================
       RESPONSIVE DESIGN
       ========================================== */
    @media (max-width: 760px) {
      .row { 
        display: flex; 
        gap: 8px; 
        align-items: center; 
        flex-wrap: wrap; 
      }
      
      .hamb {
        display: inline-block; 
        margin-left: auto;
      }
      
      .menu { 
        display: none; 
        width: 100%; 
        padding: 8px 0; 
      }
      
      .menu.open { 
        display: flex; 
        flex-direction: column; 
        align-items: stretch; 
      }
      
      .bar { 
        flex-wrap: wrap; 
      }
      
      .spacer { 
        display: none; 
      }
      
      /* Mobile form adjustments */
      #exam { 
        width: 100px; 
      }
      
      #jump { 
        width: 50px; 
      }
      
      #pagesize { 
        width: 60px; 
      }
    }

    /* ==========================================
       LAYOUT & CONTAINERS
       ========================================== */
    .container { 
      max-width: 1100px; 
      margin: 18px auto 72px; 
      padding: 0 12px; 
    }

    .meta-top { 
      color: var(--muted); 
      font-size: .95rem; 
      margin: 8px 0 12px; 
      display: flex; 
      gap: 10px; 
      flex-wrap: wrap; 
    }

    .card { 
      background: var(--surface); 
      border: 1px solid var(--border); 
      border-radius: 14px; 
      padding: 14px; 
      margin: 14px 0; 
      box-shadow: 0 1px 0 rgba(0,0,0,.03); 
    }

    .inputfield { 
      display: flex; 
      gap: 8px; 
      align-items: center; 
      flex-wrap: wrap; 
    }

    /* ==========================================
       QUESTION COMPONENTS
       ========================================== */
    .qhead { 
      display: flex; 
      gap: 8px; 
      align-items: baseline; 
      flex-wrap: wrap; 
      background: var(--primary); 
      color: #fff; 
      border-radius: 8px; 
      padding: 12px 12px; 
    }

    .qhead .qid,
    .qhead .topic { 
      color: rgba(255,255,255,.9); 
    }

    .qtitle { 
      font-weight: 800; 
    }

    .qid { 
      color: var(--muted); 
      font-size: .85rem; 
    }

    .topic { 
      margin-left: auto; 
      color: var(--muted); 
    }

    .qtext { 
      margin: 10px 0 8px; 
      line-height: 1.6; 
    }

    /* Question and answer images */
    .qimgs, 
    .cimgs { 
      display: flex; 
      flex-wrap: wrap; 
      gap: 8px; 
      margin: 8px 0; 
    }

    .qimgs img,
    .cimgs img { 
      max-width: 100%; 
      min-width: 200px;
      height: auto; 
      border: 1px solid var(--border); 
      border-radius: 10px;
      object-fit: contain;
      width: auto;
    }

    /* ==========================================
       ANSWER OPTIONS
       ========================================== */
    .opts { 
      display: grid; 
      gap: 8px; 
      margin: 12px 0 6px; 
    }

    .opt { 
      border: 1px solid var(--border); 
      border-radius: 12px; 
      padding: 10px 12px; 
      cursor: pointer; 
      display: flex; 
      gap: 10px; 
      align-items: flex-start; 
      background: color-mix(in oklab, var(--surface) 94%, transparent); 
    }

    .opt .letter { 
      font-weight: 800; 
      min-width: 1.5rem; 
    }

    .opt.selected { 
      outline: 2px solid color-mix(in oklab, var(--primary), white 40%); 
    }

    /* Answer reveal styling */
    .revealed .opt.correct { 
      background: color-mix(in oklab, var(--correct) 20%, var(--surface)); 
      border-color: color-mix(in oklab, var(--correct), var(--border) 60%); 
    }

    .revealed .opt.wrong { 
      background: color-mix(in oklab, var(--wrong) 16%, var(--surface)); 
      border-color: color-mix(in oklab, var(--wrong), var(--border) 60%); 
    }

    /* ==========================================
       ANSWER REVEAL SECTION
       ========================================== */
    details.reveal { 
      margin: 12px 0 6px; 
      border: 1px dashed var(--border); 
      border-radius: 12px; 
      padding: 0; 
    }

    details.reveal > summary { 
      cursor: pointer; 
      list-style: none; 
      font-weight: 700; 
      user-select: none; 
      padding: 12px 14px; 
      background: #f3f4f6;
      border-radius: 11px;
      color: var(--text);
      margin: 0;
    }

    details.reveal[open] > summary {
      border-radius: 11px 11px 0 0;
    }

    details.reveal > *:not(summary) {
      padding: 0 14px 10px 14px;
    }

    details.reveal > summary::marker { 
      display: none; 
    }

    /* ==========================================
       VOTING STATISTICS
       ========================================== */
    .votes { 
      margin: 10px 0 14px; 
      background: var(--vote-bg); 
      border: 1px solid var(--border); 
      border-radius: 12px; 
      padding: 12px; 
    }

    .votes .title { 
      font-weight: 800; 
      margin-bottom: 8px; 
      color: var(--vote-ink); 
    }

    .vrow { 
      display: flex; 
      align-items: center; 
      gap: 12px; 
      margin: 10px 0; 
    }

    .vrow .lab { 
      width: 1.4rem; 
      font-weight: 800; 
      color: var(--vote-ink); 
    }

    .vbar { 
      flex: 1; 
      height: 14px; 
      background: color-mix(in oklab, var(--vote-bg) 70%, var(--border)); 
      border-radius: 999px; 
      position: relative; 
      overflow: hidden; 
    }

    .vbar > span { 
      position: absolute; 
      inset: 0 0 0 0; 
      width: 0; 
      background: var(--vote-fill); 
    }

    .vrow .cnt { 
      width: 84px; 
      text-align: right; 
      color: var(--vote-ink); 
      font-variant-numeric: tabular-nums; 
    }

    /* ==========================================
       DISCUSSION SECTION
       ========================================== */
    .discussion { 
      margin: 12px 0; 
    }

    .comment { 
      border-left: 3px solid var(--border); 
      margin: 10px 0; 
      padding: 10px 12px; 
      background: color-mix(in oklab, var(--surface) 96%, transparent); 
      border-radius: 10px; 
    }

    .comment .head { 
      display: flex; 
      gap: 8px; 
      align-items: center; 
      flex-wrap: wrap; 
    }

    .author { 
      font-weight: 800; 
    }

    .badges { 
      display: flex; 
      gap: 6px; 
      flex-wrap: wrap; 
    }

    .pill { 
      display: inline-flex; 
      gap: 6px; 
      align-items: center; 
      padding: 4px 8px; 
      border-radius: 999px; 
      background: var(--chip); 
      color: var(--chip-text); 
      border: 1px solid var(--border); 
      font-size: .78rem; 
    }

    .txt { 
      margin: 6px 0; 
      line-height: 1.55; 
    }

    .txt a { 
      color: var(--primary); 
    }

    .replies { 
      margin-top: 4px; 
    }

    /* ==========================================
       PAGINATION
       ========================================== */
    .pager { 
      display: flex; 
      gap: 8px; 
      flex-wrap: wrap; 
      justify-content: center; 
      align-items: center; 
      margin: 20px 0 60px;
    }

    .pagebtn { 
      min-width: 36px; 
      text-align: center; 
      padding: 8px 10px; 
      border: 1px solid var(--border); 
      border-radius: 10px; 
      background: var(--surface); 
      color: var(--text); 
      cursor: pointer; 
    }

    .pagebtn.active { 
      background: var(--primary); 
      color: var(--primary-ink); 
      border-color: color-mix(in oklab, var(--primary), black 10%); 
    }

    .ellipsis { 
      color: var(--muted); 
      padding: 0 4px; 
    }

    /* ==========================================
       TOPIC DIVIDERS
       ========================================== */
    .topic-divider { 
      margin: 18px 0 8px; 
      padding: 16px 12px; 
      border-radius: 10px; 
      background: var(--topicbar-bg); 
      color: var(--topicbar-ink); 
      font-weight: 800; 
      display: flex; 
      align-items: center; 
    }

    /* ==========================================
       PDF OVERLAY
       ========================================== */
    #pdf-overlay {
      position: fixed; 
      inset: 0;
      display: none; 
      align-items: center; 
      justify-content: center;
      background: rgba(0,0,0,.35); 
      z-index: 1000;
    }

    #pdf-overlay .box {
      background: var(--surface); 
      color: var(--text);
      border: 1px solid var(--border);
      padding: 14px 16px; 
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,.25);
      font-weight: 700;
    }

    /* ==========================================
       PRINT STYLES
       ========================================== */
    @media print {
      /* Hide navigation elements in print */
      header, 
      #pager { 
        display: none !important; 
      }
      
      /* Preserve colors in print */
      * { 
        -webkit-print-color-adjust: exact; 
        print-color-adjust: exact; 
      }
      
      body { 
        background: #fff; 
      }

      /* Topic dividers - remove page breaks */
      .topic-divider {
        background: var(--topicbar-bg) !important;
        color: var(--topicbar-ink) !important;
        border-radius: 8px;
        padding: 8px 12px;
        margin: 8px 0 0;
        font-weight: 800;
        page-break-after: avoid;
        break-after: avoid;
      }

      /* Question headers */
      .qhead {
        background: var(--primary) !important;
        color: #fff !important;
        border-radius: 8px;
        padding: 8px 10px;
        align-items: center;
      }
      
      .qhead .qid,
      .qhead .topic {
        color: rgba(255,255,255,.9) !important;
      }

      /* Card styling for print */
      .card {
        break-inside: avoid;
        page-break-inside: avoid;
        border-color: #d7dde5;
        box-shadow: none;
        break-before: page;
        page-break-before: always;
      }
      
      .qtext { 
        margin-top: 10px; 
      }

      /* Show all reveal content, hide toggle */
      details.reveal { 
        border: none; 
        padding: 0; 
      }
      
      details.reveal > summary { 
        display: none !important; 
      }

      #pdf-overlay {
        display: none !important; 
      }
    }
  </style>
</head>

<body>
  <!-- ==========================================
       HEADER NAVIGATION
       ========================================== -->
  <header>
    <div class="bar">
      <div class="brand">ExamTopics PlayGround</div>
      <div class="spacer"></div>
      <button class="hamb" id="hamb" type="button">☰ Menu</button>
      
      <div class="menu" id="menu">
        <div class="row">
          <label for="exam">Exam</label>
          <select id="exam">
            <option>MD-102</option>
            <option>AZ-900</option>
            <option>SC-900</option>
          </select>
          <button id="load" class="btn" type="button">Load</button>
          
          <label for="jump">Page</label>
          <input id="jump" class="inputfield" type="number" min="1" step="1" placeholder="1"/>
          <button id="go" class="btn" type="button">Go</button>
          
          <label for="pagesize">Per page</label>
          <select id="pagesize">
            <option>10</option>
            <option>20</option>
            <option>30</option>
            <option>40</option>
            <option>50</option>
            <option>All</option>
          </select>
          
          <button id="theme" class="btn" type="button">Dark mode</button>
          <button id="pdf" class="btn" type="button">Generate PDF</button>
          <button id="openall" class="btn" type="button">Open All Discussions</button>
        </div>
      </div>
    </div>
  </header>

  <!-- ==========================================
       MAIN CONTENT AREA
       ========================================== -->
  <div class="container">
    <div id="meta" class="meta-top"></div>
    <div id="app">Choose an exam and press Load.</div>
    <div id="pager" class="pager"></div>
  </div>

  <!-- PDF Generation Overlay -->
  <div id="pdf-overlay">
    <div class="box" id="pdf-status">Generating PDF...</div>
  </div>

  <script>
    // Wait for DOM to be ready
    document.addEventListener('DOMContentLoaded', () => {
      /* ==========================================
         GLOBAL VARIABLES & STATE
         ========================================== */
      let PAGE_SIZE = 10;
      let DATA = [];
      let currentPage = 1;
      let currentExam = '';
      const selections = new Map(); // Store user selections for questions

      /* ==========================================
         UTILITY FUNCTIONS
         ========================================== */
      // DOM query selector shorthand
      const $ = selector => document.querySelector(selector);
      
      // Create element with optional class and text content
      const el = (tag, className, textContent) => { 
        const node = document.createElement(tag); 
        if (className) node.className = className; 
        if (textContent != null) node.textContent = textContent; 
        return node; 
      };
      
      // Calculate percentage
      const pct = (numerator, total) => total ? Math.round(numerator * 100 / total) : 0;

      /* ==========================================
         THEME MANAGEMENT
         ========================================== */
      function setTheme(mode) {
        document.documentElement.setAttribute('data-theme', mode);
        const btn = $('#theme'); 
        if (btn) btn.textContent = mode === 'dark' ? '☀️' : '🌙';
        
        // Persist theme preference
        try { 
          localStorage.setItem('viewer-theme', mode); 
        } catch(e) {
          console.warn('Cannot save theme preference:', e);
        }
      }

      // Initialize theme from localStorage or system preference
      (function initTheme() {
        let stored = null;
        try {
          stored = localStorage.getItem('viewer-theme');
        } catch(e) {
          console.warn('Cannot read theme preference:', e);
        }
        
        if (stored) {
          setTheme(stored);
        } else {
          const prefersDark = matchMedia('(prefers-color-scheme: dark)').matches;
          setTheme(prefersDark ? 'dark' : 'light');
        }
      })();

      /* ==========================================
         MOBILE MENU TOGGLE
         ========================================== */
      $('#hamb')?.addEventListener('click', () => {
        $('#menu')?.classList.toggle('open');
      });

      /* ==========================================
         HTML SANITIZATION
         ========================================== */
      const ALLOW_TAGS = new Set(['BR','B','STRONG','I','EM','U','CODE','PRE','P','UL','OL','LI','A','SPAN','DIV']);
      
      function sanitizeHTML(html) {
        const template = document.createElement('template');
        template.innerHTML = html || '';
        
        const walk = (node) => {
          [...node.childNodes].forEach(child => {
            if (child.nodeType === Node.ELEMENT_NODE) {
              const tag = child.tagName;
              
              if (!ALLOW_TAGS.has(tag)) {
                // Remove disallowed tags but keep their content
                const fragment = document.createDocumentFragment();
                while (child.firstChild) {
                  fragment.appendChild(child.firstChild);
                }
                child.replaceWith(fragment);
              } else {
                // Clean attributes for allowed tags
                [...child.attributes].forEach(attr => {
                  const name = attr.name.toLowerCase();
                  
                  if (tag === 'A' && name === 'href') {
                    const href = child.getAttribute('href') || '';
                    if (!/^https?:/i.test(href) && !href.startsWith('/')) {
                      child.removeAttribute('href');
                    } else {
                      // Add security attributes for external links
                      child.setAttribute('target', '_blank'); 
                      child.setAttribute('rel', 'noopener'); 
                    }
                  } else {
                    child.removeAttribute(name);
                  }
                });
                walk(child);
              }
            }
          });
        };
        
        walk(template.content);
        let output = template.innerHTML;
        
        // Fix broken words split by <br> tags
        output = output.replace(/([A-Za-z])<br\s*\/?>([A-Za-z])/g, '$1 $2');
        return output;
      }

      /* ==========================================
         IMAGE HANDLING
         ========================================== */
      function imageRow(urls, className = 'qimgs') {
        if (!urls || !urls.length) return null;
        
        const wrapper = el('div', className);
        urls.forEach(url => { 
          const img = new Image(); 
          img.loading = 'lazy'; 
          img.decoding = 'async'; 
          img.src = url; 
          wrapper.appendChild(img); 
        });
        return wrapper;
      }

      /* ==========================================
         VOTING STATISTICS COMPONENT
         ========================================== */
      function votesCard(votes, letters) {
        const total = (letters || []).reduce((sum, letter) => sum + (votes?.[letter] || 0), 0);
        const wrapper = el('div', 'votes');
        wrapper.appendChild(el('div', 'title', 'Answer votes'));
        
        (letters || []).forEach(letter => {
          const row = el('div', 'vrow');
          row.appendChild(el('div', 'lab', letter));
          
          const bar = el('div', 'vbar');
          const fill = el('span');
          const count = votes?.[letter] || 0;
          const percentage = total ? Math.round(count * 100 / total) : 0;
          
          fill.style.width = percentage + '%';
          bar.appendChild(fill);
          row.appendChild(bar);
          row.appendChild(el('div', 'cnt', `${count} • ${percentage}%`));
          wrapper.appendChild(row);
        });
        
        return wrapper;
      }

      /* ==========================================
         DISCUSSION COMPONENTS
         ========================================== */
      const pill = text => el('span', 'pill', text);

      function comment(node, level = 1) {
        const commentEl = el('div', 'comment'); 
        commentEl.style.marginLeft = `calc(${level-1} * var(--indent))`;
        
        const head = el('div', 'head');
        head.appendChild(el('span', 'author', node.author || '—'));
        
        const badges = el('span', 'badges');
        if (node.is_highly_voted) badges.appendChild(pill('Highly Voted'));
        if (node.is_most_recent) badges.appendChild(pill('Most Recent'));
        if (node.selected_answer) badges.appendChild(pill(`Selected: ${node.selected_answer}`));
        if (node.relative_time) badges.appendChild(pill(node.relative_time));
        badges.appendChild(pill(`▲ ${node.upvotes ?? 0}`));
        
        head.appendChild(badges); 
        commentEl.appendChild(head);

        const text = el('div', 'txt'); 
        text.innerHTML = sanitizeHTML(node.html || node.text || '');
        commentEl.appendChild(text);

        // Handle nested replies
        if (node.replies && node.replies.length) {
          const replies = el('div', 'replies');
          node.replies.forEach(reply => {
            replies.appendChild(comment(reply, Math.min(level + 1, 6)));
          });
          commentEl.appendChild(replies);
        }
        
        return commentEl;
      }

      /* ==========================================
         TOPIC DIVIDER COMPONENT
         ========================================== */
      function topicDivider(topicNumber) {
        return el('div', 'topic-divider', `Topic ${topicNumber} - Question Set 1`);
      }

      /* ==========================================
         QUESTION CARD RENDERING
         ========================================== */
      function renderCard(question) {
        const card = el('div', 'card');
        
        // Question header
        const head = el('div', 'qhead');
        const index = DATA.indexOf(question);
        head.appendChild(el('div', 'qtitle', `Question #${question.question_number || (index >= 0 ? index + 1 : '—')}`));
        head.appendChild(el('div', 'qid', `ID: ${question.question_id || '—'}`));
        head.appendChild(el('div', 'topic', `Topic ${question.topic_number || '—'}`));
        card.appendChild(head);

        // Question text content
        if (question.question_html) {
          const questionText = el('div', 'qtext'); 
          questionText.innerHTML = sanitizeHTML(question.question_html); 
          card.appendChild(questionText);
        } else if (question.question_text) { 
          card.appendChild(el('div', 'qtext', question.question_text)); 
        }
        
        // Question images
        const questionImages = imageRow(question.question_images, 'qimgs'); 
        if (questionImages) card.appendChild(questionImages);

        // Answer options handling - Dynamic extraction of available options
        const availableOptions = question.options || {};
        const showLetters = Object.keys(availableOptions).filter(letter => (availableOptions[letter] || '').trim() !== '');
        const hasOptions = showLetters.length > 0;

        let optionsWrapper = null;
        if (hasOptions) {
          optionsWrapper = el('div', 'opts');
          const chosenAnswer = selections.get(question.question_id) || null;
          
          showLetters.forEach(letter => {
            const option = el('div', 'opt'); 
            option.dataset.letter = letter;
            if (chosenAnswer === letter) option.classList.add('selected');
            
            option.appendChild(el('div', 'letter', letter));
            option.appendChild(el('div', 'text', question.options?.[letter] || ''));
            
            // Handle option selection
            option.addEventListener('click', () => {
              selections.set(question.question_id, letter);
              optionsWrapper.querySelectorAll('.opt').forEach(opt => opt.classList.remove('selected'));
              option.classList.add('selected');
              if (reveal.open) applyRevealStyles();
            });
            
            optionsWrapper.appendChild(option);
          });
          card.appendChild(optionsWrapper);
        }

        // Answer reveal section
        const reveal = document.createElement('details'); 
        reveal.className = 'reveal';
        const summary = el('summary', null, 'Reveal answer & discussion'); 
        reveal.appendChild(summary);

        const meta = el('div', 'meta-top');
        const totalVotes = showLetters.reduce((sum, letter) => sum + (question.votes?.[letter] || 0), 0);
        meta.appendChild(el('span', null, question.correct_answer ? `Correct: ${question.correct_answer}` : 'Correct answer shown below'));
        if (hasOptions) meta.appendChild(pill(`Total votes: ${totalVotes}`));
        reveal.appendChild(meta);

        // Correct answer images
        const correctAnswerImages = imageRow(question.correct_answer_images, 'cimgs'); 
        if (correctAnswerImages) reveal.appendChild(correctAnswerImages);
        
        // Voting statistics
        if (hasOptions) {
          reveal.appendChild(votesCard(question.votes || {}, showLetters));
        }

        // Discussion section
        const discussion = el('div', 'discussion');
        if (question.discussion && question.discussion.length) { 
          question.discussion.forEach(discussionItem => {
            discussion.appendChild(comment(discussionItem, 1));
          }); 
        } else { 
          discussion.appendChild(el('div', 'txt', '(No discussion)')); 
        }
        reveal.appendChild(discussion);

        // Apply correct/wrong styling when reveal is opened
        function applyRevealStyles() {
          if (!hasOptions) return;
          
          optionsWrapper.classList.add('revealed');
          const chosenAnswer = selections.get(question.question_id);
          
          optionsWrapper.querySelectorAll('.opt').forEach(opt => {
            opt.classList.remove('correct', 'wrong');
            const letter = opt.dataset.letter;
            
            // Mark correct answer
            if (question.correct_answer && letter === question.correct_answer) {
              opt.classList.add('correct');
            }
            
            // Mark wrong selection
            if (chosenAnswer && question.correct_answer && 
                chosenAnswer !== question.correct_answer && letter === chosenAnswer) {
              opt.classList.add('wrong');
            }
          });
        }
        
        // Handle reveal toggle
        reveal.addEventListener('toggle', () => { 
          if (reveal.open) {
            applyRevealStyles(); 
          } else if (hasOptions) {
            optionsWrapper.classList.remove('revealed'); 
          }
        });

        card.appendChild(reveal);
        return card;
      }

      /* ==========================================
         METADATA RENDERING
         ========================================== */
      function renderMeta() {
        const meta = $('#meta'); 
        meta.innerHTML = '';
        if (!DATA.length) return;
        
        const firstQuestion = DATA[0];
        const exam = firstQuestion.exam_code || currentExam || '';
        const rawUpdateText = firstQuestion.dump_updated_text || '';
        
        // Parse date from update text
        const dateMatch = rawUpdateText.match(/(\d{4}[-\/\. ]\d{1,2}[-\/\. ]\d{1,2})|(\d{1,2}[-\/\.]\d{1,2}[-\/\.]\d{2,4})/);
        let formattedDate = '';
        
        if (dateMatch) {
          const date = new Date(dateMatch[0]); 
          if (!isNaN(date)) {
            formattedDate = date.toLocaleDateString(undefined, {
              day: '2-digit',
              month: '2-digit',
              year: 'numeric'
            });
          }
        }
        
        const text = `Exam: ${exam} ` + (formattedDate ? 
          `with Last Updated on ${formattedDate}` : 
          (rawUpdateText ? `with ${rawUpdateText}` : ''));
          
        meta.appendChild(el('span', null, text));
      }

      /* ==========================================
         PAGINATION COMPONENT
         ========================================== */
      function paginate(totalItems, currentPage, onPageClick) {
        const pager = $('#pager'); 
        pager.innerHTML = '';
        const totalPages = Math.max(1, Math.ceil(totalItems / PAGE_SIZE));
        
        const createButton = (label, pageNumber, isActive = false, isDisabled = false) => {
          const button = el('button', 'pagebtn' + (isActive ? ' active' : ''), label);
          if (isDisabled) button.disabled = true;
          button.addEventListener('click', () => onPageClick(pageNumber));
          pager.appendChild(button);
        };
        
        // Previous button
        createButton('« Prev', Math.max(1, currentPage - 1), false, currentPage === 1);
        
        // Page number buttons with ellipsis
        const startPage = Math.max(1, currentPage - 2);
        const endPage = Math.min(totalPages, currentPage + 2);
        
        if (startPage > 1) { 
          createButton('1', 1, currentPage === 1); 
          if (startPage > 2) {
            pager.appendChild(el('span', 'ellipsis', '…')); 
          }
        }
        
        for (let page = startPage; page <= endPage; page++) {
          createButton(String(page), page, currentPage === page);
        }
        
        if (endPage < totalPages) { 
          if (endPage < totalPages - 1) {
            pager.appendChild(el('span', 'ellipsis', '…')); 
          }
          createButton(String(totalPages), totalPages, currentPage === totalPages); 
        }
        
        // Next button
        createButton('Next »', Math.min(totalPages, currentPage + 1), false, currentPage === totalPages);
      }

      /* ==========================================
         PAGE RENDERING
         ========================================== */
      function renderPage(page = 1) {
        const app = $('#app'); 
        app.innerHTML = '';
        
        const startIndex = (page - 1) * PAGE_SIZE;
        const pageQuestions = DATA.slice(startIndex, startIndex + PAGE_SIZE);
        
        let lastTopicNumber = null;
        pageQuestions.forEach(question => {
          const currentTopicNumber = (question.topic_number || '').toString();
          
          // Add topic divider when topic changes
          if (currentTopicNumber && currentTopicNumber !== lastTopicNumber) {
            app.appendChild(topicDivider(currentTopicNumber));
            lastTopicNumber = currentTopicNumber;
          }
          
          app.appendChild(renderCard(question));
        });
        
        // Update pagination and page input
        paginate(DATA.length, page, (newPage) => { 
          currentPage = newPage; 
          renderPage(currentPage); 
        });
        
        const jumpInput = $('#jump'); 
        if (jumpInput) jumpInput.value = page;
        
        renderMeta();
      }

      /* ==========================================
         EXAM DATA LOADING
         ========================================== */
      async function loadExam(examCode) {
        currentExam = (examCode || '').trim();
        
        if (!currentExam) {
          $('#app').innerHTML = '<div class="card">Choose an exam and click Load.</div>';
          $('#pager').innerHTML = ''; 
          $('#meta').innerHTML = ''; 
          return;
        }
        
        const slug = currentExam.toLowerCase();
        const url = `examtopics_${slug}_with_discussions.json`;
        
        try {
          const response = await fetch(url);
          if (!response.ok) throw new Error('HTTP ' + response.status);
          
          DATA = await response.json();
          currentPage = 1;
          renderPage(currentPage);
          
          // Save last selected exam
          try { 
            localStorage.setItem('last-exam', currentExam); 
          } catch(e) {
            console.warn('Cannot save exam preference:', e);
          }
        } catch(error) {
          console.error('Failed to load exam:', error);
          $('#app').innerHTML = `
            <div class="card">
              Could not load <code>${url}</code>.<br/>
              Please serve this folder via a local server (e.g. <code>python3 -m http.server</code>).
            </div>
          `;
          $('#pager').innerHTML = ''; 
          $('#meta').innerHTML = '';
        }
      }

      /* ==========================================
         EVENT HANDLERS
         ========================================== */
      
      // Load exam button
      $('#load')?.addEventListener('click', () => {
        loadExam($('#exam')?.value);
      });
      
      // Go to page button
      $('#go')?.addEventListener('click', () => {
        const totalPages = Math.ceil(DATA.length / PAGE_SIZE) || 1;
        const inputValue = parseInt($('#jump')?.value || '1', 10);
        const targetPage = Math.max(1, Math.min(inputValue, totalPages));
        currentPage = targetPage; 
        renderPage(currentPage);
      });
      
      // Enter key on page input
      $('#jump')?.addEventListener('keydown', event => { 
        if (event.key === 'Enter') $('#go').click(); 
      });
      
      // Theme toggle button
      $('#theme')?.addEventListener('click', () => {
        const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
        setTheme(currentTheme === 'light' ? 'dark' : 'light');
      });

      $('#openall')?.addEventListener('click', () => {
        document.querySelectorAll('details.reveal').forEach(d => { d.open = true; });
      });

      /* ==========================================
         PAGE SIZE MANAGEMENT
         ========================================== */
      (function initPageSize() {
        const selector = $('#pagesize');
        let storedPageSize = null;

        try {
          storedPageSize = localStorage.getItem('page-size');
        } catch (e) {
          console.warn('Cannot read page size preference:', e);
        }

        const numericSizes = [10, 20, 30, 40, 50];

        // Initialize PAGE_SIZE and selector value
        if (storedPageSize && String(storedPageSize).toLowerCase() === 'all') {
          PAGE_SIZE = Number.MAX_SAFE_INTEGER;           // effectively "show all"
          if (selector) selector.value = 'All';
        } else {
          const n = parseInt(storedPageSize || '10', 10);
          PAGE_SIZE = numericSizes.includes(n) ? n : 10;
          if (selector) selector.value = String(PAGE_SIZE);
        }

        // Handle user changes
        selector?.addEventListener('change', () => {
          const val = selector.value;

          if (String(val).toLowerCase() === 'all') {
            PAGE_SIZE = Number.MAX_SAFE_INTEGER;
            try { localStorage.setItem('page-size', 'All'); } 
            catch (e) { console.warn('Cannot save page size preference:', e); }
          } else {
            const newSize = parseInt(val, 10);
            PAGE_SIZE = numericSizes.includes(newSize) ? newSize : 10;
            try { localStorage.setItem('page-size', String(PAGE_SIZE)); } 
            catch (e) { console.warn('Cannot save page size preference:', e); }
          }

          currentPage = 1;
          renderPage(currentPage);
        });
      })();

      /* ==========================================
         EXAM LIST LOADING
         ========================================== */
      (async function loadExamList() {
        const selector = $('#exam');
        selector.innerHTML = '<option disabled selected value="">Loading…</option>';
        
        try {
          const response = await fetch('exams.json');
          if (!response.ok) throw new Error('exams.json not found');
          
          const examList = await response.json();
          const examCodes = (Array.isArray(examList) ? examList : [])
            .map(code => String(code).toUpperCase());
          
          selector.innerHTML = '';
          
          // Add placeholder option
          const placeholder = document.createElement('option');
          placeholder.value = ''; 
          placeholder.disabled = true; 
          placeholder.selected = true; 
          placeholder.textContent = '— Select exam —';
          selector.appendChild(placeholder);
          
          // Add exam options
          examCodes.forEach(code => {
            const option = document.createElement('option');
            option.value = code; 
            option.textContent = code;
            selector.appendChild(option);
          });
          
          // Restore last exam selection
          let lastExam = null;
          try {
            lastExam = localStorage.getItem('last-exam');
          } catch(e) {
            console.warn('Cannot read last exam preference:', e);
          }
          
          if (lastExam) {
            const upperCaseLastExam = String(lastExam).toUpperCase();
            
            // Add to dropdown if not already present
            if (![...selector.options].some(option => option.value === upperCaseLastExam)) {
              const extraOption = document.createElement('option');
              extraOption.value = upperCaseLastExam; 
              extraOption.textContent = upperCaseLastExam;
              selector.appendChild(extraOption);
            }
            
            selector.value = upperCaseLastExam;
          }
        } catch(error) {
          selector.innerHTML = '<option disabled selected>(exams.json not found)</option>';
          console.warn('Failed to load exam list:', error);
        }
      })();

      /* ==========================================
         PDF GENERATION
         ========================================== */
      const overlay = $('#pdf-overlay');
      const statusElement = $('#pdf-status');
      
      const showProgress = (message) => { 
        if (statusElement) statusElement.textContent = message || 'Working…'; 
        if (overlay) overlay.style.display = 'flex'; 
      };
      
      const hideProgress = () => { 
        if (overlay) overlay.style.display = 'none'; 
      };

      // Wait for images to load before printing
      function waitForImages(rootElement) {
        const images = [...rootElement.querySelectorAll('img')];
        
        return new Promise(resolve => {
          if (!images.length) return resolve();
          
          // Force image reload to ensure they're fresh
          images.forEach(img => {
            if (!img.complete || img.naturalWidth === 0) {
              const src = img.src;
              img.src = '';
              img.src = src;
            }
          });
          
          let remainingImages = images.length;
          const onImageComplete = () => { 
            if (--remainingImages <= 0) {
              // Much longer delay to ensure images are fully rendered in print context
              setTimeout(resolve, 2000);
            }
          };
          
          images.forEach(img => {
            if (img.complete && img.naturalWidth > 0 && img.naturalHeight > 0) {
              return onImageComplete();
            }
            
            const checkImage = () => {
              if (img.complete && img.naturalWidth > 0 && img.naturalHeight > 0) {
                onImageComplete();
              }
            };
            
            img.addEventListener('load', checkImage, { once: true });
            img.addEventListener('error', onImageComplete, { once: true });
          });
          
          // Much longer timeout for problematic images
          setTimeout(resolve, 15000);
        });
      }

      async function printAllPages() {
        const button = $('#pdf');
        
        // Guard: need data loaded
        if (!DATA.length) return;

        // Update UI state
        const originalButtonText = button ? button.textContent : '';
        if (button) { 
          button.disabled = true; 
          button.textContent = 'Generating…'; 
        }
        showProgress('Rendering all questions…');

        // Remember current page to restore later
        const previousPage = currentPage;

        // Render ALL questions with topic dividers
        const app = $('#app');
        app.innerHTML = '';
        let lastTopicNumber = null;
        
        DATA.forEach(question => {
          const currentTopicNumber = (question.topic_number || '').toString();
          
          if (currentTopicNumber && currentTopicNumber !== lastTopicNumber) {
            app.appendChild(topicDivider(currentTopicNumber));
            lastTopicNumber = currentTopicNumber;
          }
          
          app.appendChild(renderCard(question));
        });

        // Open all reveal sections for complete PDF
        app.querySelectorAll('details.reveal').forEach(details => details.open = true);

        showProgress('Loading images…');
        await waitForImages(app);

        // Brief pause for layout completion
        showProgress('Opening print dialog…');
        await new Promise(resolve => setTimeout(resolve, 150));

        // Trigger browser print dialog
        window.print();

        // Restore original paginated view
        hideProgress();
        renderPage(previousPage);
        if (button) { 
          button.disabled = false; 
          button.textContent = originalButtonText; 
        }
      }

      // PDF generation button handler
      $('#pdf')?.addEventListener('click', printAllPages);
    });
  </script>
</body>
