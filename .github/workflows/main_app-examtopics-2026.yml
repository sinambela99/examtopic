# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - app-examtopics-2026

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: Install dependencies, build, and test
        run: |
          npm install
          npm run build

      - name: Prepare Standalone Deployment
        run: |
          # Copy static assets
          cp -r .next/static .next/standalone/.next/static
          # Copy server build (the actual page bundles)
          cp -r .next/server .next/standalone/.next/server
          # Copy required manifest files
          for f in BUILD_ID build-manifest.json prerender-manifest.json \
                    routes-manifest.json required-server-files.json \
                    app-build-manifest.json app-paths-manifest.json; do
            [ -f ".next/$f" ] && cp ".next/$f" ".next/standalone/.next/$f" || true
          done
          if [ -d "public" ]; then cp -r public .next/standalone/; fi
          cp -r data .next/standalone/

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .next/standalone/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_E1A9A6F0323A4AD6A89FD19ABBBC6FFD }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_B4536C75021C4F1A984B4388E5D81462 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_04A622206EB340EC9352EBD1A6DC4147 }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'app-examtopics-2026'
          slot-name: 'Production'
          package: .